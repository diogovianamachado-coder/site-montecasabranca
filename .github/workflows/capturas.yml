# Capturas da demo (S30, aceite pelo Diogo a 17/10/2026): em cada push que toque em demo/ ou em
# design/site/ (as páginas do ChatGPT, desde 21/10), corre os testes da demo, o contrato do design
# e as capturas a 390 e 1280 px. Sem deploy, sem publicação, sem segredos. O workflow de deploy do
# site continua por criar (acordo v1.2, secção 9: só com a raiz da Amen confirmada e o «Lança» do Diogo).
name: Capturas

on:
  push:
    paths:
      - "demo/**"
      - "design/site/**"
      - ".github/workflows/capturas.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # S36 (25/10): um issue por entrega do ChatGPT em design/site

jobs:
  capturas:
    # ubuntu-24.04 fixo: o «ubuntu-latest» passou a Ubuntu 26.04 (out/2026) e o Playwright 1.56.1 não instala lá o Chromium
    # («does not support chromium on ubuntu26.04-x64»); foi isso que pôs o workflow vermelho a 21/10 e a 25/10.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mudou design/site nesta entrega? (S36)
        id: mudou
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANTES="${{ github.event.before }}"
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            if ls design/site/*.html > /dev/null 2>&1; then echo "design=true" >> "$GITHUB_OUTPUT"; else echo "design=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/compare/${ANTES}...${{ github.sha }}" --jq '.files[].filename' 2>/dev/null | grep -q '^design/site/'; then
            echo "design=true" >> "$GITHUB_OUTPUT"
          else
            echo "design=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes da demo
        run: python3 demo/ferramentas/demo.py testar

      - name: Contrato do design (páginas do ChatGPT em design/site)
        id: contrato
        run: |
          if ls design/site/*.html > /dev/null 2>&1; then
            python3 demo/ferramentas/demo.py testar --design 2>&1 | tee contrato.log
            exit "${PIPESTATUS[0]}"
          else
            echo "design/site sem páginas: nada a verificar (ver demo/base/CONTRATO.md)" | tee contrato.log
          fi

      - name: Instalar Playwright e Chromium
        id: playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Servir a demo construída
        run: |
          python3 demo/ferramentas/demo.py servir 8787 > servir.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 0.5; done
          curl -sI http://127.0.0.1:8787/ | head -1

      - name: Capturas 390 e 1280 px
        run: node demo/ferramentas/captura.cjs --base http://127.0.0.1:8787 --saida demo/_saida/capturas

      - name: Ensaio das páginas do design (montar sem tocar na demo, servir, capturar)
        id: ensaio
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: |
          if ls design/site/*.html > /dev/null 2>&1; then
            python3 demo/ferramentas/demo.py montar --para demo/_saida/ensaio | tee montar.log
            PAGINAS=$(grep '^PAGINAS=' montar.log | cut -d= -f2)
            python3 demo/ferramentas/demo.py servir 8788 --pasta demo/_saida/ensaio > servir-ensaio.log 2>&1 &
            for i in $(seq 1 20); do curl -sf http://127.0.0.1:8788/ > /dev/null && break; sleep 0.5; done
            node demo/ferramentas/captura.cjs --base http://127.0.0.1:8788 --saida demo/_saida/capturas-ensaio --paginas "$PAGINAS"
          else
            echo "design/site sem páginas: sem ensaio"
          fi

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-demo-${{ github.sha }}
          path: demo/_saida/capturas
          if-no-files-found: ignore

      - name: Guardar capturas do ensaio do design
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensaio-design-${{ github.sha }}
          path: demo/_saida/capturas-ensaio
          if-no-files-found: ignore

      - name: Issue com o resultado da entrega do design (S36)
        if: ${{ always() && github.event_name == 'push' && steps.mudou.outputs.design == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTRATO="${{ steps.contrato.outcome }}"; ENSAIO="${{ steps.ensaio.outcome }}"
          if [ "$CONTRATO" = "success" ]; then ESTADO="contrato OK"; else ESTADO="contrato FALHA"; fi
          CURTO="${GITHUB_SHA::7}"
          ASSUNTO="$(git log -1 --pretty=%s)"
          CORRIDA="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Entrega em \`design/site/\` no commit ${CURTO}: **${ASSUNTO}**"
            echo
            echo "- Contrato (\`demo.py testar --design\`): **${CONTRATO}**"
            echo "- Ensaio das páginas com o kit (capturas 390/1280): **${ENSAIO}**"
            echo "- Corrida, com os artefactos \`ensaio-design-…\` e \`capturas-demo-…\`: ${CORRIDA}"
            echo
            echo '```'
            tail -n 40 contrato.log 2>/dev/null || echo "(sem registo do contrato)"
            echo '```'
            echo
            echo "Próximo passo: o Claude monta esta entrega como revisão da demo (\`demo.py revisao rN\`) e publica as ligações; o Diogo decide por olho. Regras em \`demo/base/CONTRATO.md\`."
            echo
            echo "---"
            echo "_Issue aberto pelo workflow «Capturas» (S36, aceite pelo Diogo a 25/10/2026)._"
          } > issue.md
          gh issue create --title "Entrega do design ${CURTO}: ${ESTADO}" --body-file issue.md
